name: deploy-buddy-local
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: deploy_buddy
      POSTGRES_DB: deploy_buddy_local
      POSTGRES_PASSWORD: ${DEPLOY_BUDDY_DB_PASSWORD:?Run scripts/init_local_env.py first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - deploy_buddy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploy_buddy -d deploy_buddy_local"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  deploy_buddy_pgdata:
